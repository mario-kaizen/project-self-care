server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    location ~* \.(json|js|css|png|svg|ico|woff2)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    error_page 404 /404.html;
}
